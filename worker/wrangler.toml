name = "emiri-api"
main = "src/index.js"
compatibility_date = "2024-09-23"

[vars]
SITE_ORIGIN = "https://emiri-uranai.com"
PRICE_JPY = "1980"
# Stripe の代理販売（Managed Payments）を使う。販売者は Stripe の Link になり、税の計算も Stripe が行う
MANAGED_PAYMENTS = "true"
# Stripe の管理画面で作った価格のID（price_…）。空ならここで商品を指定する
PRICE_ID = ""

# STRIPE_SECRET_KEY はシークレット。ここには書かない（Cloudflare の管理画面で運営者本人が設定する）
